name: Build and Publish Docker Image
on:
  push:
    branches: [main]
 
permissions:
  packages: write
  contents: read
 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Новый шаг: переводим имя владельца репозитория в нижний регистр
      - name: Downcase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}
 
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${ lower(github.repository) }:latest
            ghcr.io/${ lower(github.repository) }:${{ github.sha }}

 
      - name: Summary
        run: echo "Образ Docker создан и опубликован в GHCR"

name: Day4 Frontend Check
on:
  push:
    branches: [main]
 
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Check templates
        run: |
          FAILED=0
          for file in base.html index.html events.html login.html register.html profile.html; do
            if [ ! -f "templates/$file" ]; then
              echo "FAIL: templates/$file not found!"
              FAILED=1
            fi
          done
          if [ $FAILED -ne 0 ]; then exit 1; fi
 
      - name: Check static
        run: |
          FAILED=0
          if [ ! -f "static/css/style.css" ] || [ ! -f "static/js/main.js" ]; then
            echo "FAIL: style.css or main.js is missing!"
            exit 1
          fi
          
          SIZE_CSS=$(wc -c < static/css/style.css)
          SIZE_JS=$(wc -c < static/js/main.js)
          echo "style.css bytes: $SIZE_CSS (need >= 300)"
          echo "main.js bytes: $SIZE_JS (need >= 200)"
          
          if [ $SIZE_CSS -lt 300 ]; then echo "FAIL: style.css too small"; FAILED=1; fi
          if [ $SIZE_JS -lt 200 ]; then echo "FAIL: main.js too small"; FAILED=1; fi
          if [ $FAILED -ne 0 ]; then exit 1; fi
 
      - name: Check media queries in CSS
        run: |
          grep -q "@media" static/css/style.css \
            && echo "PASS: media queries found" \
            || { echo "FAIL: no media queries"; exit 1; }
 
      - name: Check showNotification in JS
        run: |
          grep -q "showNotification" static/js/main.js \
            && echo "PASS: showNotification found" \
            || { echo "FAIL: no showNotification"; exit 1; }
 
      - name: Check ARIA attributes in templates
        run: |
          FAILED=0
          grep -q "aria-label" templates/*.html \
            && echo "PASS: aria-label found" \
            || { echo "FAIL: no aria-label"; FAILED=1; }
          grep -q "role=" templates/*.html \
            && echo "PASS: role attribute found" \
            || { echo "FAIL: no role attribute"; FAILED=1; }
          if [ $FAILED -ne 0 ]; then exit 1; fi
 
      - name: Check Dockerfile
        run: |
          FAILED=0
          grep -q "^FROM" Dockerfile && echo "PASS: FROM found" || { echo "FAIL: no FROM"; FAILED=1; }
          grep -q "^COPY" Dockerfile && echo "PASS: COPY found" || { echo "FAIL: no COPY"; FAILED=1; }
          grep -q "^CMD" Dockerfile && echo "PASS: CMD found" || { echo "FAIL: no CMD"; FAILED=1; }
          if [ $FAILED -ne 0 ]; then exit 1; fi
 
      - name: Check docker-compose.yml
        run: |
          FAILED=0
          grep -q "services" docker-compose.yml && echo "PASS: services found" || { echo "FAIL: no services"; FAILED=1; }
          grep -q "postgres" docker-compose.yml && echo "PASS: postgres found" || { echo "FAIL: no postgres"; FAILED=1; }
          if [ $FAILED -ne 0 ]; then exit 1; fi
 
      - name: Check .dockerignore
        run: |
          test -f .dockerignore \
            && echo "PASS: .dockerignore exists" \
            || { echo "FAIL: no .dockerignore"; exit 1; }
 
      - name: Syntax check app.py
        run: python -m py_compile app.py
 
      - run: echo "Проверка внешнего интерфейса на 4-й день завершена"

